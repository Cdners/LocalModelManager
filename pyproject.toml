[project]
name = "local-model-manager"
version = "0.2.0"
description = "A native Windows manager for isolated llama.cpp model services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7", "httpx>=0.28,<1", "huggingface_hub>=0.30,<2",
  "nvidia-ml-py>=12", "packaging>=24", "psutil>=6", "truststore>=0.10",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

